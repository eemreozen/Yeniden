server:
  port: 8083

spring:
  application:
    name: exchange-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yeniden_db}?currentSchema=exchange
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: exchange

  flyway:
    enabled: true
    create-schemas: true
    default-schema: exchange
    schemas: exchange
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:2500}
