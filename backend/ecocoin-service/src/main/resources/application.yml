server:
  port: 8084

spring:
  application:
    name: ecocoin-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yeniden_db}?currentSchema=ecocoin
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ecocoin

  flyway:
    enabled: true
    create-schemas: true
    default-schema: ecocoin
    schemas: ecocoin
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    template:
      retry:
        enabled: true
        initial-interval: 500ms
        max-attempts: 3
        multiplier: 2

identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:2500}
